version: 1
tools:
  - name: ops_list_projects
    description: Lists projects from a fixed operations dataset with their IDs, names, and owners. For metrics, call ops_project_stats with each ID.
    inputSchema: { type: object, additionalProperties: false }
    outputSchema:
      type: object
      properties:
        projects:
          type: array
          items:
            type: object
            properties: { id: { type: string }, name: { type: string }, owner: { type: string } }
            required: [id, name, owner]
            additionalProperties: false
      required: [projects]
      additionalProperties: false
    annotations: { readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false }
    execution: { type: cli, command: node, args: [evaluation-cli.mjs, list] }
    response: { parser: { type: json }, transform: '{"projects": data}' }
  - name: ops_project_stats
    description: Gets requests, errors, and latency in milliseconds for a project in the fixed dataset. Errors are included in the total request count.
    inputSchema:
      type: object
      properties:
        id: { type: string, enum: [atlas, boreal, coral], description: ID returned by ops_list_projects. }
      required: [id]
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        requests: { type: integer }
        errors: { type: integer }
        latencyMs: { type: integer }
      required: [requests, errors, latencyMs]
      additionalProperties: false
    annotations: { readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false }
    execution: { type: cli, command: node, args: [evaluation-cli.mjs, stats, '${input.id}'] }
    response:
      parser: { type: regex, pattern: 'requests=(?<requests>\d+) errors=(?<errors>\d+) latency_ms=(?<latency>\d+)' }
      transform: '{"requests": $number(data.requests), "errors": $number(data.errors), "latencyMs": $number(data.latency)}'
