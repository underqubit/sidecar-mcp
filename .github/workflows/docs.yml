name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build-docs.mjs'
      - 'scripts/check-json-schema-docs.mjs'
      - 'src/config.ts'
      - 'src/config-schema.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/build-docs.mjs'
      - 'scripts/check-json-schema-docs.mjs'
      - 'src/config.ts'
      - 'src/config-schema.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify JSON Schema documentation examples and coverage
        run: npm run docs:check-schema
      - name: Generate and verify bilingual documentation
        run: npm run docs:build
      - name: Upload documentation artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
