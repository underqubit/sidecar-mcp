openapi: 3.1.0
info:
  title: Catalog API
  version: '1.0'
servers:
  - url: https://catalog.example.com/api/{version}
    variables:
      version: { default: v3 }
security:
  - bearerAuth: []
paths:
  /items:
    get:
      operationId: list_items
      summary: Lists catalog items.
      tags: [items]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Catalog items.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Item' }
  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: delete_item
      summary: Deletes a catalog item.
      tags: [items]
      responses:
        '204': { description: Item deleted. }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    Item:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
      required: [id, name]
      additionalProperties: false
